name: Build Android Debug APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # GitHub UI থেকে ম্যানুয়ালি রান করার জন্য

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Node dependencies
        run: |
          npm ci || npm install

      - name: 🛠️ Build Web Production App
        run: |
          npm run build

      - name: 🤖 Setup Capacitor Android Native Project
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 📢 Inject Google AdMob App ID into AndroidManifest.xml
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          ADMOB_META='<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-2656735273686581~6802702671"/>'
          
          if [ -f "$MANIFEST_PATH" ]; then
            if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST_PATH"; then
              echo "Injecting AdMob App ID into AndroidManifest.xml..."
              sed -i "/<application/a \        $ADMOB_META" "$MANIFEST_PATH"
            else
              echo "AdMob App ID already present in manifest."
            fi
          fi

      - name: 🔨 Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 📋 Verify and locate APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/ || find android -name "*.apk"

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LudoKingPro-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
